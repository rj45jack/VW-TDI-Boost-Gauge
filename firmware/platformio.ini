; PlatformIO project for the VW TDI boost gauge.
;
; The sketch folder is the PlatformIO source directory, so the same files work
; in the Arduino IDE (open firmware/boostgauge/boostgauge.ino).
;
;   pio run                    build the default ATmega328P target
;   pio run -e atmega168       build for a 16 KB ATmega168
;   pio run -e atmega8         build for an 8 KB ATmega8 (fits without a bootloader)
;   pio test -e native         run the host-side pressure/filter tests

[platformio]
src_dir = boostgauge
default_envs = atmega328p

[avr]
platform = atmelavr
framework = arduino
lib_deps = arduino-libraries/LiquidCrystal
build_flags = -Wall

[env:atmega328p]
extends = avr
board = uno

[env:atmega168]
extends = avr
board = diecimilaatmega168

[env:atmega8]
extends = avr
board = atmegangatmega8

[env:native]
platform = native
test_framework = unity
test_build_src = no
build_flags = -I${PROJECT_DIR}/boostgauge -std=gnu++11
